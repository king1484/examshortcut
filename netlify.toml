# Netlify config — static Next.js export.
# The deployable artifact is out/ (built by `npm run build`).
# Deploys: either connect this repo for push-to-deploy, or
# `netlify deploy --prod --dir=out` from a machine with the CLI logged in.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Pure static export (out/) — Netlify's Next.js runtime plugin expects a
  # server-rendered app and fails on this repo. Skip it.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
