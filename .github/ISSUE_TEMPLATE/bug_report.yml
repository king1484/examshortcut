name: Bug report
description: Report a reproducible software problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private route in SECURITY.md. Never include credentials or student data."
  - type: input
    id: location
    attributes:
      label: Page URL or affected component
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a small reproducible example and browser/device details.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Optional screenshots or redacted error messages.
