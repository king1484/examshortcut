name: Content correction
description: Report an incorrect answer, explanation, exam detail, or source attribution.
title: "[Content]: "
body:
  - type: input
    id: location
    attributes:
      label: Question ID, topic, or page URL
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What is incorrect and what should it say?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Worked derivation or authoritative evidence
      description: Include source links and explain the calculation where relevant. For private rights concerns, use the contact route in CONTENT_RIGHTS.md.
    validations:
      required: true
