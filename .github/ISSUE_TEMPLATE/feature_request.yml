name: Feature request
description: Suggest an improvement to learning, accessibility, or contributor workflows.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and an example of the current difficulty.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement and alternatives
    validations:
      required: true
