name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/shift-collector/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r scripts/shift-collector/requirements.txt
      - name: Validate content contracts
        run: npm run validate
      - name: Check app regressions
        run: node --experimental-strip-types --test scripts/test-auth-config.mjs scripts/test-feedback.mjs scripts/test-infolinks.mjs scripts/test-score-calculator.mjs
      - name: Independently verify statistics answers
        run: python scripts/test-statistics.py
      - name: Verify imported papers and scoring
        run: |
          node scripts/verify-pyq-imports.mjs
          node scripts/verify-pyq-runtime.mjs
      - name: Test collector with mocked sources
        run: python -m unittest discover -s scripts/shift-collector -p 'test_*.py'
